name: CI

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        run: >
          pnpm exec commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

      # The PR title becomes the commit message on squash-merge, so lint it too.
      # Passed via env (not inlined into the script) to avoid shell injection.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --verbose

  verify:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:ci

      # The type tests and the docs app compile against the built library, as
      # an app's code does, so build it first.
      - name: Build library
        run: pnpm build:lib

      - name: Type tests
        run: pnpm test:types

      # This catches broken markdown/pages before they reach main and deploy.
      - name: Build docs
        run: pnpm docs:build

  # The library supports Angular 19 and later, while the repo is developed on
  # a later one. The next two jobs put the package.json and pnpm-lock.yaml of
  # a .github/angular-19.x/ folder in place of the repo's own (update such a
  # lockfile with `pnpm install --lockfile-only` in its folder), and run on
  # Node.js 22, the LTS current when Angular 19 came out. To run one locally,
  # do the same in a copy of the repo, such as a git worktree: the swap
  # replaces package.json, pnpm-lock.yaml and node_modules.
  angular-19-specs:
    name: Specs on Angular 19.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .github/angular-19.2/pnpm-lock.yaml

      # Angular 19.2, the 19 most apps run.
      - name: Use Angular 19.2
        run: cp .github/angular-19.2/package.json .github/angular-19.2/pnpm-lock.yaml .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Angular 19 has neither TestBed.tick() nor
      # provideZonelessChangeDetection(): the specs tick with
      # ApplicationRef.tick() and take the zoneless provider from
      # spec-helpers/zoneless.ts.
      - name: Test
        run: pnpm test:ci

  angular-19-types:
    name: Types on Angular 19.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .github/angular-19.0/pnpm-lock.yaml

      # The typings of Angular 19.0.0, the oldest the library supports: code
      # that uses an API only a later Angular has doesn't compile against them.
      - name: Use Angular 19.0
        run: cp .github/angular-19.0/package.json .github/angular-19.0/pnpm-lock.yaml .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc -p projects/ngx-signal-query/tsconfig.lib.json --noEmit
