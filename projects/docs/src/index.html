<!doctype html>
<!--
  "auto" follows the system theme, in the prerendered pages too. A theme the
  reader picks in the navbar is saved, and ng-doc's inline script puts it back
  before the next page shows, except Light: ng-doc saves it as an empty string,
  so it comes back as "auto". The build doesn't inline critical CSS
  (angular.json): that CSS left out the dark theme and part of the layout, so
  the page first showed light on a dark system, and its layout shifted once the
  full CSS came.
-->
<html lang="en" data-theme="auto">
<head>

  <title>ngx-signal-query: server state for Angular on signals and RxJS</title>
  <meta name="description" content="Data fetching, caching and mutations for Angular, built on signals and RxJS. Observables end to end, TanStack Query concepts.">

  <meta property="og:title" content="ngx-signal-query">
  <meta property="og:description" content="Data fetching, caching and mutations for Angular, built on signals and RxJS. Observables end to end, TanStack Query concepts.">
  <meta property="og:url" content="https://dhutaryan.github.io/ngx-signal-query/">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
